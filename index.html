<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="캘린더">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<title>내 캘린더</title>
<style>
/* 애플 캘린더식: 월 그리드 + 선택한 날 일정 목록, 체크리스트 탭. 시스템 서체, 빨간 강조색. */
:root{
  --bg:#ffffff; --surface:#f4f4f7; --card:#ffffff; --ink:#1c1c1e; --muted:#8e8e93; --line:#ececf0;
  --red:#ff3b30; --blue:#007aff; --green:#34c759; --orange:#ff9500; --purple:#af52de; --teal:#30b0c7; --pink:#ff2d55;
  --sheet-dim:rgba(0,0,0,.35);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --pink:#ff375f;
  --bg:#000000; --surface:#1c1c1e; --card:#1c1c1e; --ink:#ffffff; --muted:#8e8e93; --line:#2c2c2e;
  --red:#ff453a; --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --purple:#bf5af2; --teal:#40c8e0;
  --sheet-dim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --pink:#ff375f;
  --bg:#000000; --surface:#1c1c1e; --card:#1c1c1e; --ink:#ffffff; --muted:#8e8e93; --line:#2c2c2e;
  --red:#ff453a; --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --purple:#bf5af2; --teal:#40c8e0;
  --sheet-dim:rgba(0,0,0,.6); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
.app{max-width:760px;margin:0 auto;padding-block:12px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seg{display:flex;background:var(--surface);border-radius:9px;padding:2px}
.seg button{padding:6px 16px;border-radius:7px;font-size:.88rem;font-weight:500;color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.plus{color:var(--red);font-size:1.9rem;line-height:1;width:40px;height:40px;display:grid;place-items:center;font-weight:300}
.tools-r{display:flex;gap:2px;align-items:center}
.welcome{background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;animation:fadeUp .3s ease-out}
.welcome strong{font-size:1rem}
.welcome p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.5}
.wbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.wbtns button{padding:9px 14px;border-radius:10px;font-weight:600;font-size:.9rem}
#welcome-go{background:var(--red);color:#fff}
#welcome-skip{color:var(--muted)}
.status:empty{display:none}
/* 아래쪽 도구 막대 (애플 캘린더처럼 오늘 버튼은 왼쪽 아래) */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:space-between;align-items:center;
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb, var(--bg) 82%, transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
#today{color:var(--red);font-size:1.05rem;font-weight:500;padding:4px 2px;transition:opacity .15s}
#today:active{opacity:.45}
.bottombar .vseg{margin:0 auto}
#mtitle{cursor:pointer}
.sinput{font:inherit;color:var(--ink);background:var(--card);border:none;border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.shint{color:var(--muted);font-size:.85rem;padding:2px 4px}
.sres{display:flex;flex-direction:column;background:var(--card);border-radius:10px;overflow:hidden}
.sres .ev{padding:10px 12px}
.sres .d{font-size:.78rem;color:var(--red);font-variant-numeric:tabular-nums}
.status{font-size:.75rem;color:var(--muted);min-height:1em;text-align:right}
.status.err{color:var(--red)}

.monthhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:2rem;font-weight:700;margin:0;letter-spacing:-.01em}
h1 .yr{color:var(--red)}
.nav{display:flex;gap:4px;align-items:center}
.nav button{color:var(--red);font-size:1rem;padding:6px 10px;border-radius:8px}
.nav .arrow{font-size:1.3rem}

.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));touch-action:pan-y}
.dow{font-size:.78rem;color:var(--muted);text-align:center;padding-bottom:6px;font-weight:500}
.dow.sun{color:var(--red)}
.day{border-top:1px solid var(--line);min-height:72px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.day .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:1.12rem;font-variant-numeric:tabular-nums}
.day.out .num{color:var(--muted);opacity:.5}
.day.sun:not(.out) .num{color:color-mix(in srgb, var(--red) 80%, var(--muted))}
.day.sat:not(.out) .num{color:color-mix(in srgb, var(--blue) 75%, var(--muted))}
.dow.sat{color:var(--blue)}
.day.hol:not(.out){background:none}
.day.hol:not(.out) .num{color:var(--red);font-weight:600}
.day.ann:not(.out){background:none}
.hname{font-size:.58rem;line-height:1.2;color:color-mix(in srgb, var(--red) 85%, var(--ink));opacity:.9;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hname.ann{color:var(--purple)}
.hname.love{color:var(--pink)}
.day.love:not(.out){background:none}
.hline.love{color:var(--pink)}
.day.out .hname{opacity:.4}
@media (min-width:640px){.hname{text-align:right;font-size:.66rem}}
.hline{display:flex;gap:8px;align-items:center;font-size:.85rem;font-weight:600;color:var(--red);padding:2px 4px 6px}
.hline.ann{color:var(--purple)}
.hline i{width:8px;height:8px;border-radius:50%;background:currentColor;display:block}
.legend{display:flex;gap:14px;font-size:.72rem;color:var(--muted);flex-wrap:wrap;opacity:.85}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:7px;height:7px;border-radius:50%;display:block}
.day.today:not(.sel) .num{color:var(--red);font-weight:700}
.day.sel .num{background:var(--ink);color:var(--bg);font-weight:600}
.day.sel.today .num{background:var(--red);color:#fff;box-shadow:0 2px 8px color-mix(in srgb, var(--red) 35%, transparent)}
.dots{display:none}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.chips{display:flex;width:100%;flex-direction:column;gap:2px}
.chip{--c:var(--muted);font-size:.64rem;line-height:1.35;padding:1px 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:left;font-weight:500;
  background:color-mix(in srgb, var(--c) 14%, transparent);color:color-mix(in srgb, var(--c) 72%, var(--ink));border-left:2px solid var(--c)}
@media (min-width:640px){
  .day{min-height:104px;align-items:stretch}
  .day .num{align-self:flex-end;font-size:.95rem;width:26px;height:26px}
  .chip{font-size:.68rem;padding:1px 4px;text-overflow:ellipsis}
}

.daylist{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:12px}
.daylist h2{font-size:.95rem;font-weight:600;margin:0 0 6px;color:var(--ink)}
.ev{box-sizing:border-box;display:flex;gap:12px;align-items:stretch;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.ev .bar{width:3px;border-radius:2px;flex:none}
.ev .info{flex:1;min-width:0;display:flex;flex-direction:column}
.ev .t{font-weight:600;overflow-wrap:anywhere}
.ev .n{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.ev .time{font-size:.85rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;flex:none;display:flex;flex-direction:column}
.empty{color:var(--muted);font-size:.9rem;padding:14px 4px}
.plans{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.plans span{font-size:.88rem;color:var(--ink);overflow-wrap:anywhere}
.plans b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;margin-right:8px}
.prow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.prow input[type=date],.prow input[type=time],.prow input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:none;border-radius:6px;padding:5px 8px;box-sizing:border-box}
.prow input[type=text]{flex:1 1 100%;min-width:0}
.pdel{margin-left:auto;color:var(--muted);font-size:1.3rem;line-height:1;padding:0 6px}
.prow input.pplace{font-size:.85rem;padding:4px 8px}
.plans .plink{margin-left:6px;font-size:.82rem}
.pempty{padding:0 14px 10px;color:var(--muted);font-size:.82rem}

/* 체크리스트 */
.list-head{display:flex;justify-content:space-between;align-items:baseline}
.prog{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.groups{display:flex;flex-direction:column;gap:22px}
.group h3{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:0}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px 4px}
.ghead button{color:var(--muted);font-size:.78rem;padding:2px 6px;flex:none}
.lh-r{display:flex;gap:12px;align-items:baseline}
.lh-btn{color:var(--red);font-size:1rem;font-weight:500;padding:4px 2px}
.lh-btn[aria-pressed="true"]{font-weight:700}
.newgroup{color:var(--red);font-weight:500;padding:12px 14px;background:var(--surface);border-radius:12px;text-align:left}
.box{background:var(--surface);border-radius:12px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.item:last-of-type{border-bottom:none}
.item:last-of-type:not(:last-child){border-bottom:1px solid var(--line)}
.box:has(.addrow[hidden]) .item:last-of-type{border-bottom:none}
/* 밀어서 삭제 */
.swrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swrap:last-of-type:not(:last-child){border-bottom:1px solid var(--line)}
.box:has(.addrow[hidden]) .swrap:last-of-type{border-bottom:none}
.swrap .item{border-bottom:none!important;background:var(--surface);position:relative;z-index:1;touch-action:pan-y;transition:transform .2s ease}
.swdel{position:absolute;top:0;right:0;bottom:0;width:80px;background:var(--red);color:#fff;font-weight:600;font-size:.95rem;opacity:0;transition:opacity .12s}
.swrap:has(> [style*="translateX"]) .swdel{opacity:1}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.check svg{width:14px;height:14px;opacity:0}
.item.done .check{background:var(--red);border-color:var(--red)}
.item.done .check svg{opacity:1}
.item .body{flex:1;min-width:0;text-align:left}
.item .txt{overflow-wrap:anywhere}
.item.done .txt{color:var(--muted);text-decoration:line-through}
.item .when{font-size:.78rem;color:var(--red)}
.lnk{color:var(--blue);text-decoration:none;display:inline-flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.lnk:hover{text-decoration:underline}
.tag{font-size:.66rem;font-weight:600;padding:1px 5px;border-radius:4px;border:1px solid currentColor;color:var(--green)}
.tag.yt{color:var(--red)}
.item .edit{color:var(--muted);font-size:.8rem;padding:4px 6px}
.addrow{color:var(--red);padding:11px 14px;width:100%;text-align:left;font-weight:500}
.ckinline{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;align-self:center}
.ckinline.on{background:var(--red);border-color:var(--red)}
.ckinline svg{width:12px;height:12px;opacity:0}.ckinline.on svg{opacity:1}

/* 시트 */
.dim{position:fixed;inset:0;background:var(--sheet-dim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);box-shadow:0 -8px 30px rgba(0,0,0,.12);width:100%;max-width:560px;border-radius:14px 14px 0 0;max-height:92%;overflow:auto;padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.dim{align-items:center}.sheet{border-radius:14px}}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;position:sticky;top:0;background:var(--surface)}
.sheet-bar strong{font-size:1rem}
.sheet-bar button{color:var(--red);font-size:1rem}
.sheet-bar .ok{font-weight:600}
.sheet-bar .ok:disabled{opacity:.35;cursor:default}
.fields{display:flex;flex-direction:column;gap:18px;padding:4px 16px 8px}
.fbox{background:var(--card);border-radius:10px;overflow:hidden}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:24px}
.frow:last-child{border-bottom:none}
.frow input[type=text],.fbox textarea{font:inherit;color:var(--ink);background:none;border:none;width:100%;padding:0;outline:none}
.fbox textarea{min-height:70px;resize:vertical;padding:10px 14px;box-sizing:border-box}
.fbox select{font:inherit;color:var(--ink);background:var(--surface);border:none;border-radius:6px;padding:4px 8px;max-width:60%}
.wdays{display:flex;gap:6px;flex-wrap:wrap}
.wdays button{width:34px;height:34px;border-radius:50%;background:var(--surface);color:var(--ink);font-size:.85rem}
.wdays button[aria-pressed="true"]{background:var(--red);color:#fff}
.shelp{font-size:.8rem;color:var(--muted);padding:0 14px 10px;line-height:1.45}
.sbtn{color:var(--red);font-weight:500;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.sbtn:last-child{border-bottom:none}
.sbtn:disabled{color:var(--muted);cursor:default}
.ev{cursor:pointer}
.plink{font-size:.85rem;color:var(--blue);text-decoration:none;align-self:flex-start}
.wkh{font-size:.88rem;font-weight:600;margin:12px 0 2px;color:var(--ink);display:flex;gap:6px;align-items:baseline}
.wkh.today{color:var(--red)}
.wkh small{font-weight:600;font-size:.72rem}
.wkempty{color:var(--muted);font-size:.82rem;padding:2px 4px 6px}
.vseg{display:flex;background:var(--surface);border-radius:8px;padding:2px;margin-right:4px}
.vseg button{padding:3px 10px;border-radius:6px;font-size:.82rem;color:var(--ink)}
.vseg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.frow input[type=date],.frow input[type=time]{font:inherit;color:var(--ink);background:var(--surface);border:none;border-radius:6px;padding:4px 8px}
.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:16px;transition:background .2s}
.toggle span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.toggle input:checked+span{background:var(--green)}
.toggle input:checked+span::after{transform:translateX(20px)}
.toggle input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:26px;height:26px;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.danger{color:var(--red);padding:12px 14px;width:100%;text-align:center;font-weight:500}
/* 부드러운 움직임 */
@keyframes dimIn{from{opacity:0}to{opacity:1}}
@keyframes dimOut{from{opacity:1}to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes popOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.96)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dim{animation:dimIn .22s ease-out}
.sheet{animation:sheetUp .34s cubic-bezier(.2,.9,.3,1)}
.dim.closing{animation:dimOut .22s ease-in forwards}
.dim.closing .sheet{animation:sheetDown .24s ease-in forwards}
@media (min-width:640px){.sheet{animation:popIn .22s ease-out}.dim.closing .sheet{animation:popOut .2s ease-in forwards}}
#view-cal:not([hidden]),#view-list:not([hidden]){animation:fadeIn .25s ease-out}
.daylist.anim > *{animation:fadeUp .25s ease-out}
.seg button{transition:background .2s,box-shadow .2s}
.vseg button{transition:background .2s,box-shadow .2s}
.day{transition:background .2s}
.day .num{transition:background .2s,color .2s,transform .15s}
.day:active .num{transform:scale(.88)}
.check,.ckinline{transition:background .2s,border-color .2s,transform .15s}
.check svg,.ckinline svg{transition:opacity .2s}
.check:active{transform:scale(.85)}
.item .txt{transition:color .2s}
.plus,.lh-btn,.nav button,.addrow,.sbtn,.newgroup,.ghead button,.item .edit,.sheet-bar button,.danger,.colors button,.wdays button{transition:opacity .15s,transform .15s,background .2s}
.plus:active,.lh-btn:active,.nav button:active,.addrow:active,.sbtn:active,.newgroup:active,.ghead button:active,.item .edit:active,.sheet-bar button:active,.danger:active{opacity:.45}
.colors button:active,.wdays button:active{transform:scale(.88)}
.ev{transition:background .15s}
.ev:active{background:color-mix(in srgb, var(--ink) 6%, transparent)}
/* 캘린더 일정도 밀어서 삭제 */
.swrap.evw{border-bottom:none}
.evw .ev{background:var(--bg);position:relative;z-index:1;touch-action:pan-y;transition:transform .2s ease,background .15s}
/* 일정 끌어서 옮기기 */
.ev,.chip,.day{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dragsrc{opacity:.35;transform:scale(.97);transition:opacity .15s,transform .15s}
.ghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;padding:7px 12px;border-radius:9px;font-size:.88rem;font-weight:600;
  background:var(--card);color:var(--ink);box-shadow:0 10px 28px rgba(0,0,0,.22);border-left:3px solid var(--c);max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.drop{background:color-mix(in srgb, var(--red) 12%, transparent);border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:16px;align-items:center;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  background:color-mix(in srgb, var(--ink) 90%, transparent);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:.9rem;max-width:calc(100% - 32px);box-sizing:border-box}
.trash{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;flex-direction:column;align-items:center;gap:4px;
  width:84px;height:84px;justify-content:center;border-radius:50%;background:var(--card);color:var(--muted);box-shadow:0 8px 26px rgba(0,0,0,.18);
  transform:translate(-50%,140%) scale(.8);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.2,.9,.3,1.2),opacity .2s,background .15s,color .15s}

  // 저장하면 페이지가 새 버전으로 다시 열리므로, 보던 달·날짜·탭·스크롤을 기억했다가 되살린다.
  function uiState(){ return {y:view.getFullYear(), m:view.getMonth(), sel:sel, tab:tab, wk:weekPref, sy:window.scrollY||0}; }
  function remember(){ try { sessionStorage.setItem('cal-ui', JSON.stringify(uiState())); } catch(e){} }
  window.addEventListener('scroll', function(){ remember(); }, {passive:true});
  function render(){ renderGrid(); renderDay(); renderList(); remember(); }

  $('tab-cal').onclick=function(){ setTab('cal'); };
  $('tab-list').onclick=function(){ setTab('list'); };
  // 검색: 일정 제목·메모·시간별 계획·체크리스트에서 찾기
  function fmt(k){ var d=parse(k); return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'. ('+DOW[d.getDay()]+')'; }
  function searchSheet(){
    var s=sheet('검색','',function(){ return true; }); s.ok.hidden=true;
    var q=el('input','sinput'); q.type='search'; q.id='search-q'; q.placeholder='일정, 메모, 계획 검색'; q.setAttribute('enterkeyhint','search');
    var out=el('div'); out.style.cssText='display:flex;flex-direction:column;gap:10px';
    s.fields.append(q,out);
    function run(){
      var t=q.value.trim().toLowerCase(); out.innerHTML='';
      if (!t){ out.append(el('div','shint','제목, 메모, 시간별 계획, 체크리스트에서 찾아요.')); return; }
      var hit=function(x){ return (x||'').toLowerCase().indexOf(t)>=0; };
      var evs=state.events.filter(function(e){ return hit(e.title)||hit(e.note)||hit(e.place)||(e.plan||[]).some(function(p){ return hit(p.text)||hit(p.place); }); })
        .sort(function(a,b){ return b.date.localeCompare(a.date); });
      var its=allItems().filter(function(it){ return hit(it.text); });
      if (!evs.length && !its.length){ out.append(el('div','shint','“'+q.value.trim()+'” 검색 결과가 없어요.')); return; }
      if (evs.length){
        out.append(el('div','shint','일정 '+evs.length+'개'));
        var box=el('div','sres');
        evs.forEach(function(e){
          var b=el('button','ev'); b.type='button';
          var bar=el('span','bar'); bar.style.background='var(--'+e.color+')';
          var info=el('span','info');
          info.append(el('span','d', fmt(e.date)+(e.endDate?' ~ '+fmt(e.endDate):'')), el('span','t',e.title));
          var mp=(e.plan||[]).filter(function(p){ return hit(p.text); });
          mp.slice(0,2).forEach(function(p){ info.append(el('span','n',(p.time?p.time+' ':'')+p.text)); });
          if (!mp.length && hit(e.note)) info.append(el('span','n',e.note));
          b.append(bar,info);
          b.onclick=function(){ var d=parse(e.date); sel=e.date; view=new Date(d.getFullYear(),d.getMonth(),1); closeSheet(); setTab('cal'); render(); window.scrollTo(0,0); };
          box.append(b);
        });
        out.append(box);
      }
      if (its.length){
        out.append(el('div','shint','체크리스트 '+its.length+'개'));
        var box2=el('div','sres');
        its.forEach(function(it){
          var b=el('button','ev'); b.type='button';
          var info=el('span','info');
          if (it.date) info.append(el('span','d',fmt(it.date)));
          info.append(el('span','t',(it.done?'✓ ':'')+it.text));
          b.append(info);
          b.onclick=function(){ closeSheet(); if (it.date){ var d=parse(it.date); sel=it.date; view=new Date(d.getFullYear(),d.getMonth(),1); setTab('cal'); } else setTab('list'); render(); window.scrollTo(0,0); };
          box2.append(b);
        });
        out.append(box2);
      }
    }
    q.addEventListener('input',run); run(); q.focus();
  }
  $('search').onclick=searchSheet;
  // 설정: 기능 켜고 끄기, 백업 저장·불러오기
  function backupJson(){ return JSON.stringify({events:state.events, groups:state.groups, settings:state.settings}, null, 2); }
  function saveBackup(btn){
    var name='내캘린더-백업-'+TODAY+'.json', blob=new Blob([backupJson()],{type:'application/json'});
    try {
      var file=new File([blob], name, {type:'application/json'});
      if (navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file]}).then(function(){ btn.textContent='백업 파일을 보냈어요'; }).catch(function(){});
        return;
      }
    } catch(e){}
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000); btn.textContent='백업 파일을 저장했어요';
  }
  function applyBackup(p){
    state.events=p.events; state.groups=p.groups; if (p.settings) state.settings=p.settings;
    if (!state.settings) state.settings={repeat:false, week:false, place:false, alarm:false};
    delete state.fresh; refreshLove(); render(); saveNow();
  }
  function readBackup(file, done, fail){
    var r=new FileReader();
    r.onload=function(){ try { var p=JSON.parse(r.result); if (!Array.isArray(p.events) || !Array.isArray(p.groups)) throw 0; done(p); } catch(e){ fail(); } };
    r.readAsText(file);
  }
  function settingsSheet(){
    var ST=state.settings, nx={};
    var s=sheet('설정','완료',function(){ Object.keys(nx).forEach(function(k){ ST[k]=nx[k].checked; }); if (!ST.week) weekPref=false;
      ST.love={start:lvS.value, gf:lvG.value, me:lvM.value}; refreshLove(); });
    var box=el('div','fbox');
    [['repeat','반복 일정','매주 헬스처럼 반복되는 일정을 한 번에 등록해요.'],
     ['week','주간 보기','달력 위에 월/주 버튼이 생겨서 한 주씩 볼 수 있어요.'],
     ['place','장소','일정과 시간별 계획에 장소를 적으면 네이버 지도로 바로 열려요.']
    ].forEach(function(f){
      var tg=el('label','toggle'); var c=el('input'); c.type='checkbox'; c.id='set-'+f[0]; c.checked=!!ST[f[0]]; tg.append(c, el('span')); nx[f[0]]=c;
      box.append(row(f[1],tg)); var h=el('div','shelp',f[2]); box.append(h);
    });
    s.fields.append(box);
    var lv=state.settings.love||{}, lb=el('div','fbox');
    var lvS=inp('date','set-love',lv.start), lvG=inp('date','set-gf',lv.gf), lvM=inp('date','set-me',lv.me);
    lb.append(row('사귄 날',lvS), row('여자친구 생일',lvG), row('내 생일',lvM));
    lb.append(el('div','shelp','100일·200일·주년과 생일을 달력에 분홍색으로 표시해요. 생일은 연도와 상관없이 매년 표시돼요.'));
    s.fields.append(el('div','shint','우리 기념일'), lb);
    var bk=el('div','fbox');
    var sv=el('button','sbtn','백업 파일로 저장'); sv.type='button';
    sv.onclick=function(){ saveBackup(sv); };
    var fi=el('input'); fi.type='file'; fi.id='backup-file'; fi.hidden=true;
    var ld=el('button','sbtn','백업 파일 불러오기'); ld.type='button';
    var pending=null;
    ld.onclick=function(){
      if (pending){ var p=pending; pending=null; closeSheet(); applyBackup(p); return; }
      fi.click();
    };
    fi.onchange=function(){
      var file=fi.files && fi.files[0]; if (!file) return;
      readBackup(file, function(p){ pending=p; ld.textContent='지금 일정이 백업 내용으로 바뀌어요. 한 번 더 누르면 불러와요 (일정 '+p.events.length+'개)'; },
        function(){ ld.textContent='백업 파일이 아니에요. 다른 파일을 골라 주세요'; });
    };
    bk.append(sv, ld, fi);
    s.fields.append(el('div','shint','백업'), bk);
    s.fields.append(el('div','shelp','일정은 이 휴대폰 안에만 저장돼요. 휴대폰을 바꾸거나 앱을 지우기 전에 백업 파일을 저장해 두세요.'));
  }
  $('settings').onclick=settingsSheet;
  $('plus').onclick=function(){ if (tab==='cal') eventSheet(null); else itemSheet(null, state.groups[0]); };
  $('vm-m').onclick=function(){ weekPref=false; render(); };
  $('vm-w').onclick=function(){ weekPref=true; var d=parse(sel); view=new Date(d.getFullYear(),d.getMonth(),1); render(); };
  // 손가락으로 좌우로 밀어서 달 넘기기
  function goMonth(dir){
    if (weekMode()){ var d=parse(sel); d=new Date(d.getFullYear(), d.getMonth(), d.getDate()+7*dir); sel=key(d); view=new Date(d.getFullYear(),d.getMonth(),1); }
    else view=new Date(view.getFullYear(),view.getMonth()+dir,1);
    render();
    var g=$('grid');
    try { if (g.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches)
      g.animate([{transform:'translateX('+(dir*48)+'px)',opacity:.25},{transform:'none',opacity:1}],{duration:220,easing:'ease-out'}); } catch(e){}
  }
  (function(){
    var g=$('grid'), x0=null, y0=0;
    g.addEventListener('touchstart',function(ev){ if (ev.touches.length!==1){ x0=null; return; } x0=ev.touches[0].clientX; y0=ev.touches[0].clientY; },{passive:true});
    g.addEventListener('touchend',function(ev){
      if (x0===null || dragging){ x0=null; return; } var t=ev.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
      if (Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) goMonth(dx<0?1:-1);
    },{passive:true});
  })();
  // 월 제목을 누르면 오늘로 돌아간다
  $('mtitle').onclick=function(){ sel=TODAY; view=new Date(now.getFullYear(),now.getMonth(),1); render(); };
  document.addEventListener('keydown',function(ev){
    if (ev.key==='Escape'){ closeSheet(); return; }
    // 컴퓨터에서는 ← → 키로 달 넘기기
    var t=ev.target && ev.target.tagName;
    if (tab==='cal' && !sheetOpen() && t!=='INPUT' && t!=='TEXTAREA' && t!=='SELECT'){
      if (ev.key==='ArrowLeft') goMonth(-1); else if (ev.key==='ArrowRight') goMonth(1);
    }
  });
  // 일정 끌어서 옮기기: 일정을 꾹 누른 채로 달력의 다른 날짜에 놓는다 (컴퓨터는 마우스로 끌기)
  var drag=null, dragging=false, suppressClick=0, lastTouch=0, toastTimer=null;
  function addDays(k,n){ var d=parse(k); return key(new Date(d.getFullYear(), d.getMonth(), d.getDate()+n)); }
  function findEvent(id){ for (var i=0;i<state.events.length;i++) if (state.events[i].id===id) return state.events[i]; return null; }
  function toast(msg, undo){
    var t=$('toast'); t.innerHTML=''; t.append(el('span',null,msg));
    if (undo){ var u=el('button',null,'되돌리기'); u.type='button'; u.onclick=function(){ undo(); t.classList.remove('show'); }; t.append(u); }
    t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); }, 4500);
  }
  function beginPending(target, x, y, mouse){
    if (sheetOpen() || drag) return;
    var src=target && target.closest && target.closest('[data-eid]'); if (!src || target.closest('a,.swdel')) return;
    var e=findEvent(src.dataset.eid); if (!e) return;
    drag={e:e, from:src.dataset.k, src:src, x:x, y:y, mouse:mouse, active:false, over:null, ghost:null};
    if (!mouse) drag.timer=setTimeout(startDrag, 380);
  }
  function startDrag(){
    if (!drag) return; drag.active=true; dragging=true; closeOpen();
    drag.src.classList.add('dragsrc'); $('trash').classList.add('show');
    var g=el('div','ghost',drag.e.title); g.style.setProperty('--c','var(--'+drag.e.color+')'); document.body.append(g); drag.ghost=g;
    moveDrag(drag.x, drag.y);
    try { if (navigator.vibrate) navigator.vibrate(12); } catch(e){}
  }
  function moveDrag(x, y){
    drag.ghost.style.transform='translate('+(x-30)+'px,'+(y-44)+'px)';
    var tr=$('trash').getBoundingClientRect(), pad=24;
    drag.overTrash = x>tr.left-pad && x<tr.right+pad && y>tr.top-pad && y<tr.bottom+pad;
    $('trash').classList.toggle('hot', drag.overTrash);
    var t=drag.overTrash ? null : document.elementFromPoint(x, y), cell=t && t.closest && t.closest('.day');
    if (drag.over && drag.over!==cell) drag.over.classList.remove('drop');
    if (cell) cell.classList.add('drop'); drag.over=cell;
  }
  function pendingMove(x, y){
    if (!drag) return false;
    if (!drag.active){
      if (Math.abs(x-drag.x)>8 || Math.abs(y-drag.y)>8){ if (drag.mouse) startDrag(); else { clearTimeout(drag.timer); drag=null; return false; } }
      else return false;
    }
    moveDrag(x, y); return true;
  }
  function endDrag(cancel){
    if (!drag) return; clearTimeout(drag.timer); var d=drag; drag=null;
    if (!d.active) return;
    dragging=false; suppressClick=Date.now();
    d.src.classList.remove('dragsrc'); if (d.ghost) d.ghost.remove(); if (d.over) d.over.classList.remove('drop');
    $('trash').classList.remove('show','hot');
    if (!cancel && d.overTrash){ trashEvent(d.e, d.from); return; }
    var to=!cancel && d.over && d.over.dataset.k;
    if (to && to!==d.from) moveEvent(d.e, d.from, to);
  }
  function trashEvent(e, k){
    var before=JSON.stringify(state);
    if (e.repeat) e.except=(e.except||[]).concat([k]);   // 반복 일정은 그날 하나만 지운다
    else state.events=state.events.filter(function(x){ return x!==e; });
    render(); scheduleSave();
    toast('“'+e.title+'” 삭제했어요', function(){ state=JSON.parse(before); render(); scheduleSave(); });
  }
  function moveEvent(e, from, to){
    var before=JSON.stringify(state), off=Math.round((parse(to)-parse(from))/864e5);
    if (e.repeat){   // 반복 일정은 그날 하나만 옮긴다
      e.except=(e.except||[]).concat([from]);
      var c=JSON.parse(JSON.stringify(e)); c.id=uid('e'); c.repeat=''; c.repeatDays=[]; c.repeatUntil=''; c.except=[]; c.date=to; c.endDate='';
      c.plan=(c.plan||[]).map(function(p){ p.id=uid('p'); p.date=to; return p; }); state.events.push(c);
    } else {
      e.date=addDays(e.date, off); if (e.endDate) e.endDate=addDays(e.endDate, off);
      (e.plan||[]).forEach(function(p){ if (p.date) p.date=addDays(p.date, off); });
    }
    sel=to; var d=parse(to); view=new Date(d.getFullYear(), d.getMonth(), 1);
    render(); scheduleSave();
    toast('“'+e.title+'”을(를) '+(d.getMonth()+1)+'월 '+d.getDate()+'일로 옮겼어요', function(){ state=JSON.parse(before); render(); scheduleSave(); });
  }
  document.addEventListener('touchstart',function(ev){ lastTouch=Date.now(); if (ev.touches.length===1) beginPending(ev.target, ev.touches[0].clientX, ev.touches[0].clientY, false); else endDrag(true); },{passive:true});
  document.addEventListener('touchmove',function(ev){ if (!drag) return; var t=ev.touches[0]; if (pendingMove(t.clientX, t.clientY)) ev.preventDefault(); },{passive:false});
  document.addEventListener('touchend',function(){ endDrag(false); });
  document.addEventListener('touchcancel',function(){ endDrag(true); });
  document.addEventListener('mousedown',function(ev){ if (ev.button!==0 || Date.now()-lastTouch<800) return; beginPending(ev.target, ev.clientX, ev.clientY, true); });
  document.addEventListener('mousemove',function(ev){ if (drag && drag.mouse && pendingMove(ev.clientX, ev.clientY)) ev.preventDefault(); });
  document.addEventListener('mouseup',function(){ if (drag && drag.mouse) endDrag(false); });
  document.addEventListener('click',function(ev){ if (Date.now()-suppressClick<350){ ev.stopPropagation(); ev.preventDefault(); } },true);
  document.addEventListener('contextmenu',function(ev){ if (drag) ev.preventDefault(); });

  function start(data){
    var d = data && data.ui;
    if (!d){ try { d = JSON.parse(sessionStorage.getItem('cal-ui')||'null'); } catch(e){} }
    if (d && typeof d.y==='number'){ view=new Date(d.y,d.m,1); if (d.sel) sel=d.sel; weekPref=!!d.wk; }
    render();
    if (d && d.tab==='list') setTab('list');
    if (d && d.sy) setTimeout(function(){ window.scrollTo(0,d.sy); }, 0);
  }
  refreshLove(); start({});
  // 처음 열었을 때: 백업 파일을 불러오면 지금까지의 일정이 들어온다
  if (state.fresh){
    var wc=$('welcome'); wc.hidden=false;
    var wf=el('input'); wf.type='file'; wf.hidden=true; wc.append(wf);
    $('welcome-go').onclick=function(){ wf.click(); };
    $('welcome-skip').onclick=function(){ delete state.fresh; wc.hidden=true; saveNow(); };
    wf.onchange=function(){ var f=wf.files&&wf.files[0]; if (!f) return;
      readBackup(f, function(p){ wc.hidden=true; applyBackup(p); toast('일정 '+p.events.length+'개를 불러왔어요'); },
        function(){ $('welcome-msg').textContent='백업 파일이 아니에요. 받은 "내캘린더-백업" 파일을 골라 주세요.'; }); };
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
})();
</script>
</body>
</html>
